services:
  mysql:
    image: mysql:8.4
    container_name: dms-mysql
    environment:
      MYSQL_DATABASE: dms
      MYSQL_USER: dms
      MYSQL_PASSWORD: dms
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dms-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dms-mysql-data:
