<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="display:flex;flex-direction:column;width:256px;height:100%;min-height:100%;box-sizing:border-box;border-right:1px solid #e2e8f0;background:#ffffff;color:#0f172a;font-family:'Be Vietnam Pro', ui-sans-serif, system-ui, sans-serif">
  <div style="border-bottom:1px solid #e2e8f0;padding:20px 24px">
    <div style="font-size:18px;line-height:28px;font-weight:600;letter-spacing:-0.025em">DMS</div>
    <div style="font-size:12px;line-height:16px;color:#64748b">Dormitory Management System</div>
  </div>
  <nav style="flex:1;display:flex;flex-direction:column;gap:4px;padding:16px 12px">
    <sc-for list="{{ items }}" as="item" hint-placeholder-count="5">
      <div style="border-radius:6px;padding:8px 12px;font-size:14px;line-height:20px;font-weight:500;background:{{ item.bg }};color:{{ item.fg }}">{{ item.label }}</div>
    </sc-for>
  </nav>
  <div style="border-top:1px solid #e2e8f0;padding:16px 24px">
    <div style="font-size:14px;line-height:20px;font-weight:500">{{ fullName }}</div>
    <div style="font-size:12px;line-height:16px;color:#64748b">{{ roleLabel }}</div>
    <button type="button" style="margin-top:12px;width:100%;border-radius:6px;border:1px solid #cbd5e1;background:#ffffff;padding:6px 12px;font:inherit;font-size:14px;line-height:20px;font-weight:500;color:#334155;cursor:pointer" style-hover="background:#f1f5f9">Sign out</button>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:256,&quot;height&quot;:760},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;STUDENT&quot;,&quot;BUILDING_MANAGER&quot;,&quot;ADMIN&quot;],&quot;default&quot;:&quot;STUDENT&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fullName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nguyễn Thị Thu Trang&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;roleLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Student&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const NAV = [
      ['Home', 'ALL'],
      ['Registration', 'STUDENT'], ['My declaration', 'STUDENT'], ['My residence', 'STUDENT'], ['Invoices', 'STUDENT'], ['Repair tickets', 'STUDENT'],
      ['Check-in', 'BUILDING_MANAGER'], ['Residents', 'BUILDING_MANAGER'], ['Meter readings', 'BUILDING_MANAGER'], ['Repair tickets', 'BUILDING_MANAGER'], ['Announcements', 'BUILDING_MANAGER'], ['Violations', 'BUILDING_MANAGER'],
      ['Facilities', 'ADMIN'], ['Registration rounds', 'ADMIN'], ['Building managers', 'ADMIN'], ['Warning reviews', 'ADMIN'], ['Reports', 'ADMIN'], ['Settings', 'ADMIN'], ['Audit log', 'ADMIN'],
    ];
    const role = this.props.role ?? 'STUDENT';
    const active = this.props.active ?? 'Home';
    const items = NAV.filter(([, r]) => r === 'ALL' || r === role).map(([label]) => ({
      label, bg: label === active ? '#0f172a' : 'transparent', fg: label === active ? '#ffffff' : '#334155',
    }));
    return { items, fullName: this.props.fullName ?? 'Nguyễn Thị Thu Trang', roleLabel: this.props.roleLabel ?? 'Student' };
  }
}
</script>
</body>
</html>
