spring:
  application:
    name: dms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  web:
    error:
      include-stacktrace: never
      include-message: never

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

dms:
  clock:
    zone: Asia/Ho_Chi_Minh
